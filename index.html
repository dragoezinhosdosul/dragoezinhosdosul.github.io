<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2E4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dradoezinhos">
<meta name="description" content="Gestão da escola Dradoezinhos do Sul — chamada, turmas e financeiro.">
<title>Dradoezinhos do Sul — Gestão</title>
<style>
  html,body{height:100%;margin:0;background:#0B2E4F;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .crest{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;
    background:linear-gradient(150deg,#E08B1E,#B45F06);display:grid;place-items:center;
    font-size:26px;font-weight:800;color:#0B2E4F;box-shadow:0 10px 28px rgba(0,0,0,.35)}
  h1{font-size:19px;margin:0 0 6px;font-weight:700;letter-spacing:-.3px}
  p{font-size:13px;color:#A9C4DA;margin:0;line-height:1.5}
  .bar{width:150px;height:4px;border-radius:99px;background:#1B4A6F;margin:20px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#E08B1E;border-radius:99px;
    animation:m 1.1s infinite ease-in-out}
  @keyframes m{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
  .fail{max-width:330px;margin:0 auto}
  .fail button{margin-top:18px;padding:12px 20px;border-radius:12px;border:0;
    background:#E08B1E;color:#0B2E4F;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="boot">
  <div>
    <div class="crest">DRZ</div>
    <h1>Dradoezinhos do Sul</h1>
    <p>Escola oficial do Itabuna EC</p>
    <div class="bar"><i></i></div>
  </div>
</div>
<script>
/* Carrega o aplicativo da fonte unica (Supabase Storage).
   O endereco do GitHub Pages fica curto e o app pode ser atualizado
   sem republicar: basta trocar o arquivo na nuvem. */
(function () {
  var SRC = 'https://susgrgdmelfrgppcsegr.supabase.co/storage/v1/object/public/drz/index.html';

  function falhou(msg) {
    document.getElementById('boot').innerHTML =
      '<div class="fail"><div class="crest">DRZ</div>' +
      '<h1>Nao foi possivel abrir</h1>' +
      '<p>' + msg + '</p>' +
      '<button onclick="location.reload()">Tentar de novo</button></div>';
  }

  fetch(SRC + '?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      if (!html || html.indexOf('<!DOCTYPE') !== 0) throw new Error('conteudo invalido');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      falhou('Verifique a internet do aparelho e tente novamente.');
    });
})();
</script>
</body>
</html>
