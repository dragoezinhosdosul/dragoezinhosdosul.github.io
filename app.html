<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2E4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dragõezinhos">
<meta name="description" content="Gestão da escola Dragõezinhos do Sul — chamada, turmas e financeiro.">
<meta name="robots" content="noindex, nofollow">
<title>Dragõezinhos do Sul — Gestão</title>
<link rel="apple-touch-icon" href="https://susgrgdmelfrgppcsegr.supabase.co/storage/v1/object/public/drz/apple-touch-icon.png">
<link rel="icon" type="image/png" href="https://susgrgdmelfrgppcsegr.supabase.co/storage/v1/object/public/drz/icon-192.png">
<style>
  html,body{height:100%;margin:0;background:#0B2E4F;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #boot{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .crest{width:130px;height:auto;margin:0 auto 14px}
  .crest img{width:100%;height:auto;display:block}
  h1{font-size:20px;margin:0 0 6px;font-weight:700;letter-spacing:-.3px}
  p{font-size:13px;color:#A9C4DA;margin:0;line-height:1.5}
  .bar{width:150px;height:4px;border-radius:99px;background:#1B4A6F;margin:20px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#E08B1E;border-radius:99px;
    animation:m 1.1s infinite ease-in-out}
  @keyframes m{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
  .fail{max-width:330px;margin:0 auto}
  .fail button{margin-top:18px;padding:12px 20px;border-radius:12px;border:0;
    background:#E08B1E;color:#0B2E4F;font-weight:700;font-size:14px}
  a.voltar{display:inline-block;margin-top:22px;font-size:11.5px;color:#7E9BB4;text-decoration:none}
</style>
</head>
<body>
<div id="boot">
  <div>
    <div class="crest"><img src="https://susgrgdmelfrgppcsegr.supabase.co/storage/v1/object/public/drz/mascote.png" alt=""></div>
    <h1>Dragõezinhos do Sul</h1>
    <p>Gestão da escola</p>
    <div class="bar"><i></i></div>
    <a class="voltar" href="https://dragoezinhosdosul.com.br">← site da escola</a>
  </div>
</div>
<script>
/* Carrega o aplicativo da fonte unica (Supabase Storage).
   O endereco do GitHub Pages fica curto e o app pode ser atualizado
   sem republicar: basta trocar o arquivo na nuvem. */
(function () {
  var SRC = 'https://susgrgdmelfrgppcsegr.supabase.co/storage/v1/object/public/drz/index.html';

  function falhou(msg) {
    document.getElementById('boot').innerHTML =
      '<div class="fail"><div class="crest"><img src="https://susgrgdmelfrgppcsegr.supabase.co/storage/v1/object/public/drz/mascote.png" alt=""></div>' +
      '<h1>Nao foi possivel abrir</h1>' +
      '<p>' + msg + '</p>' +
      '<button onclick="location.reload()">Tentar de novo</button>' +
      '<p style="margin-top:14px">Matriculas: (73) 98107-6221</p></div>';
  }

  fetch(SRC + '?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      if (!html || html.indexOf('<!DOCTYPE') !== 0) throw new Error('conteudo invalido');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      falhou('Verifique a internet do aparelho e tente novamente.');
    });
})();
</script>
</body>
</html>
